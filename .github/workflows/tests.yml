name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt -r slack-requirements.txt
      # No OPENAI_API_KEY is set: the suite must pass without LLM access.
      - run: python -m pytest -v
      - run: python eval/benchmark.py --mode reference --output /tmp/sql-reference.json
      - run: python eval/benchmark.py --mode reference --dataset eval/heldout-support.json --output /tmp/sql-support-reference.json
      - uses: actions/upload-artifact@v4
        with:
          name: reference-evaluation-python-${{ matrix.python-version }}
          path: |
            /tmp/sql-reference.json
            /tmp/sql-support-reference.json
